name: checks
on: [push, pull_request]
jobs:
  plan-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Plan-rule and cleaning tests
        run: python -m pytest -q tests
      - name: Dashboard JSON is valid and has no secrets
        run: python checks/validate_site.py
      - name: Fresh copy can clean and plan an order sheet (SQLite, no secrets)
        run: |
          python -m bakery setup
          python -m bakery clean data/raw/orders/orders_2026-11-10.csv
          python -m bakery plan 2026-11-10
          python checks/verify_plan.py 2026-11-10
